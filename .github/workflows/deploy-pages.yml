name: Deploy educational game

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - style.css
      - script.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare game files
        run: |
          mkdir _site
          cp index.html style.css script.js _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
